name: Release des skills

# À chaque tag v* : une archive .zip par skill et deux archives globales, attachées à une release.
# Adresses stables : https://github.com/WeAreCasus/casus-plugin/releases/latest/download/<nom>.zip
on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Vérifier que le tag est la version de plugin.json
        run: |
          version="$(jq -r .version .claude-plugin/plugin.json)"
          if [ "v$version" != "$GITHUB_REF_NAME" ]; then
            echo "::error::Le tag $GITHUB_REF_NAME ne correspond pas à la version $version de .claude-plugin/plugin.json"
            exit 1
          fi

      - name: Construire les archives
        run: .github/scripts/build-archives.sh dist

      - name: Publier la release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" dist/*.zip --title "Casus $GITHUB_REF_NAME" --generate-notes
